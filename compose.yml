services:

  # ======================================================
  # Go Web Application
  # ======================================================
  app:

    # Build the Docker image from the Dockerfile
    # located in the current directory.
    build: .

    # Automatically restart the container if it crashes.
    # If the user manually stops it, Docker will not restart it.
    restart: unless-stopped

    # Make port 8080 available only to
    # other containers on the Docker network.
    #
    # The application is NOT directly exposed
    # to the host machine.
    expose:
      - "8080"

    # Environment variables used by the Go application.
    #
    # The application builds the MongoDB connection string
    # using these values.
    #
    # "mongodb" is the Docker Compose service name.
    # Docker automatically resolves it to the MongoDB
    # container's IP address through its internal DNS.
    environment:
      MONGODB_HOST: mongodb
      MONGODB_PORT: "27017"

    # Start the MongoDB container before the application.
    depends_on:
      mongodb:
        condition: service_healthy

    # Watch the project directory.
    # If a source file changes, Docker Compose
    # rebuilds the image and restarts the container.
    develop:
      watch:
        - action: rebuild
          path: .

    # Connect only to the backend network.
    #
    # The application cannot be reached
    # directly from outside Docker.
    networks:
      - backend

  # ======================================================
  # Nginx Reverse Proxy / Load Balancer
  # ======================================================
  front:

    # Build the custom Nginx image.
    build:
      context: ./nginx

    # Only Nginx is exposed to the host.
    #
    # The browser communicates with Nginx,
    # which forwards requests to the Go application.
    ports:
      - "5000:80"

    # Restart automatically if the container crashes.
    restart: unless-stopped

    # Start after the application container.
    depends_on:
      - app

    # Nginx belongs to both networks.
    #
    # frontend:
    #   Receives requests from users.
    #
    # backend:
    #   Communicates with the Go application.
    networks:
      - frontend
      - backend

  # ======================================================
  # MongoDB Database
  # ======================================================
  mongodb:

    # Official MongoDB image from Docker Hub.
    image: mongo:8.0

    # Restart automatically if the database crashes.
    restart: unless-stopped

    # Persist MongoDB data.
    #
    # MongoDB stores all database files in:
    #
    #     /data/db
    #
    # We mount a Docker named volume on that directory
    # so that deleting the container does NOT delete
    # the database.
    volumes:
      - mongodb-data:/data/db

    # Verify MongoDB is accepting connections.
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    # Mount the Docker secret inside the container.
    #
    # Docker will make the secret available as a file:
    #
    #   /run/secrets/mongodb_password
    #
    # The secret is not baked into the image and is not
    # stored inside the compose.yml file.
    secrets:
      - mongodb_password

    # MongoDB is only reachable
    # from the backend network.
    networks:
      - backend
      
# ======================================================
# Docker Volumes
# ======================================================
#
# Named volumes are managed by Docker.
#
# Unlike container storage, they survive:
#
#   docker compose down
#
# The volume is only removed if we execute:
#
#   docker compose down -v
#
volumes:
  mongodb-data:

# ======================================================
# Docker Secrets
# ======================================================
#
# Secrets are sensitive data managed by Docker.
#
# Unlike environment variables, they are mounted
# inside the container as files under:
#
#   /run/secrets/
#
# This prevents passwords from being stored directly
# inside the compose.yml file.
#
secrets:

  # MongoDB password stored in a local file.
  # The file itself is excluded from Git using .gitignore.
  mongodb_password:
    file: ./secrets/mongodb_password.txt

# ======================================================
# Docker Networks
# ======================================================
#
# frontend:
#   Public network.
#   Only the reverse proxy (Nginx) is connected.
#
# backend:
#   Private network.
#   Used for communication between
#   Nginx, the Go application and MongoDB.
#
# The Go application and MongoDB are
# isolated from the outside world.
#
networks:

  frontend:

  backend: